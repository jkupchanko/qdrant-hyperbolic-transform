name: tests and benchmark

# Runs the real benchmark against a real Qdrant on infrastructure the author
# does not control, and prints the result table into the log. The point is that
# nobody has to take a README table on trust: open the run and read the numbers.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: wait for qdrant
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:6333/readyz && break
            sleep 2
          done
          curl -sf http://localhost:6333/ | head -c 200; echo

      # The claim is about HNSW. If no graph was built the harness refuses to
      # print a table, so a green run with a table in it is itself the proof
      # that a real graph was measured.
      - name: depth ladder
        run: |
          python examples/depth_ladder.py \
            --url http://localhost:6333 --queries 60 --builds 3 --width 10 \
            | tee ladder.txt
          grep -q "HNSW graph confirmed" ladder.txt \
            || { echo "::error::no HNSW graph was built; numbers are meaningless"; exit 1; }

      - name: product taxonomy demo
        run: |
          python examples/product_taxonomy.py --url http://localhost:6333 | tee demo.txt
          grep -q "NO RESULTS" demo.txt \
            && { echo "::error::benchmark refused to report; no graph"; exit 1; }
          grep -q "NOISE FLOOR" demo.txt \
            || { echo "::error::no noise floor reported"; exit 1; }

      - name: summary
        if: always()
        run: |
          {
            echo '## Depth ladder (prefetch 10, 3 builds per arm)'
            echo '```'
            cat ladder.txt 2>/dev/null || echo "(did not run)"
            echo '```'
            echo '## Product taxonomy, matched cost (hnsw_ef swept)'
            echo '```'
            sed -n '/^arm /,$p' demo.txt 2>/dev/null || echo "(did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-output
          path: |
            ladder.txt
            demo.txt
